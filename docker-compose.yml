services:
  app:
    build: .
    container_name: spendwise-api
    ports:
      - '${PORT:-8080}:8080'
    environment:
      - PORT=${PORT:-8080}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-spendwise}
      - DB_PASSWORD=${DB_PASSWORD:-spendwise}
      - DB_NAME=${DB_NAME:-spendwise_main_db}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spendwise

  db:
    image: postgres:17-alpine
    container_name: spendwise-db
    environment:
      - POSTGRES_USER=${DB_USER:-spendwise}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-spendwise}
      - POSTGRES_DB=${DB_NAME:-spendwise_main_db}
    ports:
      - '${DB_EXTERNAL_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-spendwise} -d ${DB_NAME:-spendwise_main_db}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - spendwise

volumes:
  pgdata:

networks:
  spendwise:
    driver: bridge
